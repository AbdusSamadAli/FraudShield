global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["payment-api:8000"]

  - job_name: dashboard-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["dashboard-api:8001"]

  - job_name: feature-engine
    dns_sd_configs:
      - names: ["feature-engine"]
        type: A
        port: 9100

  - job_name: stream-services
    static_configs:
      - targets: ["outbox-relay:9100", "ml-scorer:9100", "decision-service:9100", "simulator:9100"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
